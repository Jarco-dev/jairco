services:
    bot:
        build:
            target: development
        restart: unless-stopped
        environment:
            NODE_ENV: development
            DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
            LOG_LEVEL: ${LOG_LEVEL}

            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            POSTGRES_USER: prisma
            POSTGRES_PASSWORD: password
            POSTGRES_DATABASE: discord-bot

            POSTGRES_SHADOW_HOST: postgres-shadow
            POSTGRES_SHADOW_PORT: 5432
            POSTGRES_SHADOW_USER: prisma
            POSTGRES_SHADOW_PASSWORD: password
            POSTGRES_SHADOW_DATABASE: shadow

            CHOKIDAR_USEPOLLING: "true"
        volumes:
            - "./src:/usr/src/app/src"
            - "./tsconfig.json:/usr/src/app/tsconfig.json"
        depends_on:
            postgres:
                condition: service_healthy
            postgres-shadow:
                condition: service_healthy
        networks:
            - backend

    postgres:
        image: postgres:17
        restart: unless-stopped
        environment:
            POSTGRES_USER: prisma
            POSTGRES_PASSWORD: password
            POSTGRES_DB: discord-bot
        volumes:
            - "dev_postgres_data:/var/lib/postgresql/data"
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U prisma -d discord-bot"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - backend

    postgres-shadow:
        image: postgres:17
        restart: unless-stopped
        environment:
            POSTGRES_USER: prisma
            POSTGRES_PASSWORD: password
            POSTGRES_DB: shadow
        ports:
            - "5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U prisma -d shadow"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - backend

volumes:
    dev_postgres_data:

networks:
    backend:
